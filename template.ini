[custom]
; 可在此处自定义追加或新增地区/场景正则（与 /sub 的 region_append/region 参数叠加）：
; region_append=US,硅谷|俄勒冈|圣克拉拉|美西|美东
; region=MY,(?i)(?:大马|马来)

; 默认过滤机场信息/提示节点（不影响 Subscription-UserInfo 流量与到期时间提取）
exclude_remarks=(?i)(到期|过期|過期|剩余|剩餘|流量|重置|套餐|官网|官網|网址|網址|域名|最新地址|群组|群組|频道|頻道|通知|公告|维护|維護|失联|失聯|防失联|防失聯|订阅|訂閱|客服|更新|使用说明|使用說明|教程|购买|購買|续费|續費|邀请|邀請|返利|优惠|優惠|推广|推廣|Expire|Traffic|Remain)


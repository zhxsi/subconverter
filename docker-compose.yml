services:
  subconverter:
    image: subconverter-local:latest
    container_name: subconverter-local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        THREADS: ${THREADS:-4}
    restart: unless-stopped
    ports:
      - "${SUBCONVERTER_PORT:-25500}:25500"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      SAVE_TOKEN: ${SAVE_TOKEN:-}
    volumes:
      - ./pref.toml:/base/pref.toml:ro
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:25500/version >/dev/null || exit 1" ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
